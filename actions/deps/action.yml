name: Vibernt CI deps
description: Optional. Restores the installed node_modules saved for the exact install identity (actions/cache, no prefix fallback), verifies it with the package manager's offline mode, or installs in full and saves the new tree. See docs/NODE_MODULES.md.
inputs:
  directory:
    description: The directory that holds the lockfile, relative to the workspace.
    default: .
  manager:
    description: pnpm, npm or auto (from the lockfile).
    default: auto
  outputs:
    description: Paths outside node_modules that the install creates (generated clients and the like), one per line, relative to directory. They are saved and restored with the tree; any other change outside node_modules keeps the tree from being saved.
    default: ''
  metadata:
    description: Save and restore pnpm's metadata cache with the tree (its offline verify needs it under a supply-chain policy). auto (when the project sets minimumReleaseAge or trustPolicy), true or false.
    default: auto
  save:
    description: Save a new tree after a full install. A pull request from a fork never saves.
    default: 'true'
  store-guard:
    description: Before a full install through the Vibernt dependency store, compare its R2 path with the public registry on a random sample of the lockfile (48 tarballs, seeded by the job) and leave it out of the job unless it took at most 0.8x the registry's time.
    default: 'true'
outputs:
  cache-hit:
    description: true when the exact tree was restored and verified.
    value: ${{ steps.install.outputs.cache-hit }}
  mode:
    description: restored, install or fallback (a restored tree that did not verify).
    value: ${{ steps.install.outputs.mode }}
  key:
    description: The install identity key.
    value: ${{ steps.plan.outputs.key }}
  registry:
    description: After a full install through the dependency store's guard, store or public; empty when the guard did not run.
    value: ${{ steps.install.outputs.registry }}
  store-guard:
    description: The guard's measurement as JSON (use, reason, sample, seed, store and direct timings, where the store's answers came from); empty when it did not run.
    value: ${{ steps.install.outputs.store-guard }}
runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      run: node "$GITHUB_ACTION_PATH/index.mjs" plan
      env:
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_MANAGER: ${{ inputs.manager }}
        INPUT_OUTPUTS: ${{ inputs.outputs }}
        INPUT_METADATA: ${{ inputs.metadata }}
    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: ${{ steps.plan.outputs.key }}
    - id: install
      shell: bash
      run: node "$GITHUB_ACTION_PATH/index.mjs" install
      env:
        INPUT_SAVE: ${{ inputs.save }}
        INPUT_STORE_GUARD: ${{ inputs.store-guard }}
        VIBERNT_DEPS_HIT: ${{ steps.restore.outputs.cache-hit }}
    - if: steps.install.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: ${{ steps.plan.outputs.key }}
    # What became of the save on a drop-in runner: saved (under which job's scope, when GitHub ran this job on a runner
    # started for another), or why not. Elsewhere it prints nothing; it never fails the job.
    - if: always() && steps.install.outputs.save == 'true'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/index.mjs" report
      env:
        VIBERNT_DEPS_KEY: ${{ steps.plan.outputs.key }}
